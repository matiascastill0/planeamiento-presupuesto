[project]
name = "planeamiento-presupuesto"
version = "1.0.0"
description = "Armado, validación, consolidación y reporte del Presupuesto 2027 · Planeamiento Credicorp Capital"
requires-python = ">=3.11"

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = ["*.ipynb"]
# Globales que provee el runtime de Databricks
builtins = ["spark", "display", "dbutils"]

[tool.ruff.lint]
# Errores reales: sintaxis, nombres no definidos y comparaciones inválidas
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Celdas para pegar en 99_ejecutar_todo: usan variables de celdas anteriores del notebook
"databricks/celdas/*" = ["F821"]
