name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar herramientas
        run: pip install ruff
      - name: Lint (errores reales)
        run: ruff check .
      - name: Compilación
        run: python -m compileall -q .
      - name: Sin datos ni secretos
        run: python herramientas/verificar_repo.py
